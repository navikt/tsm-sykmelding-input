[versions]
junit-jupiter-engine = "5.11.3"
slf4j = "1.7.25"
prometheus = "0.16.0"
jackson = "3.1.5"

[libraries]
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
prometheus = { module = "io.prometheus:simpleclient", version.ref = "prometheus" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson"}

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.1.0" }
